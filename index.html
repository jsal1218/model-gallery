<!doctype html>
<html lang="en">
<head>
<meta name="robots" content="noindex">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f1ec">
<title>Atelier 360 · Model &amp; Outfit Gallery</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%2216%22 fill=%22%231f1d1a%22/%3E%3Ctext x=%2216%22 y=%2222%22 font-size=%2218%22 text-anchor=%22middle%22 fill=%22%23f4f1ec%22 font-family=%22Georgia%22%3EA%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>
<header class="top">
  <div class="brand"><span class="mark">A</span><div><h1>Atelier 360</h1><p>Model &amp; outfit turnaround</p></div></div>
  <div class="meta" id="metaLine">—</div>
</header>

<main class="layout">
  <section class="viewer-wrap" aria-label="360 degree viewer">
    <div class="viewer" id="viewer" tabindex="0" role="img" aria-roledescription="360 viewer" aria-label="Model turnaround. Drag or use arrow keys to rotate.">
      <div class="stage" id="stage">
        <img id="imgA" alt="" draggable="false">
        <img id="imgB" alt="" draggable="false" aria-hidden="true">
      </div>
      <div class="loader" id="loader"><div class="loader-inner"><span id="loaderText">Loading frames…</span><div class="bar"><i id="loaderBar"></i></div></div></div>
      <div class="hint" id="hint">Drag to rotate · pinch, wheel or double‑tap to zoom</div>
      <div class="zoom-badge" id="zoomBadge" hidden><span id="zoomVal">1.0×</span><button id="zoomReset" type="button">Reset</button></div>
      <div class="hires" id="hires" hidden>HD</div>
    </div>

    <div class="controls">
      <button class="icon-btn" id="prevBtn" type="button" aria-label="Rotate left"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <div class="dial-wrap">
        <svg class="dial" viewBox="0 0 64 64" aria-hidden="true">
          <circle cx="32" cy="32" r="27" class="ring"/>
          <g id="dialTicks"></g>
          <g id="dialHand"><circle cx="32" cy="7" r="4.2" class="dot"/></g>
          <path d="M32 24 l5 8 h-10z" class="cam" transform="rotate(180 32 32) translate(0 22)"/>
        </svg>
        <div class="angle"><b id="angleVal">0°</b><span id="angleLabel">Front</span></div>
      </div>
      <button class="icon-btn" id="nextBtn" type="button" aria-label="Rotate right"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="pill" id="autoBtn" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v4h-4"/></svg><span>Auto‑rotate</span></button>
    </div>
    <div class="quick" id="quickAngles" role="group" aria-label="Jump to angle"></div>
  </section>

  <aside class="panel">
    <h2>Model</h2>
    <div class="models" id="models" role="tablist" aria-label="Models"></div>
    <h2 id="photorealH" hidden>Photorealistic</h2>
    <div class="models" id="photoreal" role="tablist" aria-label="Photorealistic models" hidden></div>
    <h2>Outfits</h2>
    <div class="outfits" id="outfits" role="list"></div>
    <div class="note" id="note"></div>
  </aside>
</main>
<footer class="foot">Fictional AI‑generated fit models · Private preview</footer>
<script src="js/app.js?v=4"></script>
</body>
</html>
